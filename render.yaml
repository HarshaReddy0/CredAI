services:
  - type: web
    name: credai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_DEEPFACE
        value: "false"
      - key: ADMIN_API_KEY
        generateValue: true
